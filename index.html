<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C Fundamentals Visualizer</title>
  <meta name="description" content="Interactive, animated walkthroughs of C fundamentals — types and bytes, control flow, the call stack, arrays, pointers, strings, structs and dynamic memory — with the matching C code highlighted line by line.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Apply the saved theme before first paint so the page never flashes the wrong one. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('cfv-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">{C}</span>
      <div>
        <h1>C Fundamentals Visualizer</h1>
        <p>See the bytes, frames and pointers behind every line of C.</p>
      </div>
    </div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Topics"></nav>
    <button id="theme" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode (T)">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="stage-wrap">
      <div class="toolbar">
        <div class="ops">
          <input id="val" type="number" placeholder="value" aria-label="Input value" data-lock>
          <div id="ops" class="btns"></div>
        </div>
        <div class="util">
          <button id="random" class="btn ghost" data-lock title="Reset with random values">Random</button>
          <button id="clear" class="btn ghost" data-lock>Clear</button>
        </div>
      </div>

      <div class="stage">
        <svg id="svg" role="img" aria-label="Memory visualization"></svg>
        <ul class="legend" aria-label="Legend">
          <li><i class="k-cur"></i>current</li>
          <li><i class="k-path"></i>done / waiting</li>
          <li><i class="k-cmp"></i>test / read</li>
          <li><i class="k-found"></i>result</li>
          <li><i class="k-new"></i>written</li>
          <li><i class="k-del"></i>error / freed</li>
        </ul>
      </div>

      <div class="playbar">
        <label class="speed">Speed
          <input id="speed" type="range" min="1" max="10" value="5">
          <span id="speed-out">0.7s</span>
        </label>
        <label class="switch"><input type="checkbox" id="stepmode"><span></span>Step-by-step</label>
        <button id="next" class="btn" disabled title="Next step (→)">Next step ▸</button>
        <div id="stats" class="stats"></div>
      </div>

      <div id="output" class="output" aria-live="polite">—</div>
    </section>

    <aside class="side">
      <div class="panel code-panel">
        <div class="panel-head">
          <span>C code · <b id="code-title">overview</b></span>
          <button id="copy" class="mini" title="Copy code">Copy</button>
        </div>
        <div id="chips" class="chips"></div>
        <pre id="code" class="code"></pre>
      </div>
      <div class="panel">
        <div class="panel-head"><span>Execution log</span></div>
        <ul id="log" class="log" aria-live="polite"></ul>
      </div>
      <div class="panel">
        <div class="panel-head"><span id="about-title">About</span></div>
        <p id="about" class="about"></p>
        <table id="cx" class="cx"></table>
      </div>
    </aside>
  </main>

  <script src="js/core.js"></script>
  <script src="js/types.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/calls.js"></script>
  <script src="js/arrays.js"></script>
  <script src="js/pointers.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/structs.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
